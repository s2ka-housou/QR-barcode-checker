<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR・バーコード照合アプリ</title>
    <!-- 相性の良いhtml5-qrcodeライブラリを使用 -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; color: #333; }
        h1 { font-size: 18px; text-align: center; margin-bottom: 16px; }
        .card { background: white; padding: 14px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 12px; }
        #reader { width: 100%; max-width: 360px; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #000; }
        .result-box { margin-top: 8px; padding: 10px; border-radius: 8px; background: #f0f0f2; font-size: 14px; line-height: 1.5; }
        .label { font-weight: bold; color: #666; font-size: 11px; margin-top: 4px; }
        .value { font-size: 15px; color: #000; font-family: monospace; font-weight: bold; margin-bottom: 4px; word-break: break-all; }
        .status { text-align: center; font-size: 18px; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 8px; }
        .match { background: #e2fbe8; color: #1e7e34; }
        .mismatch { background: #fce8e6; color: #c53929; }
        .waiting { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <h1>QR・バーコード照合アプリ</h1>

    <!-- 1. カメラエリア -->
    <div class="card">
        <div id="reader"></div>
    </div>

    <!-- 2. 照合判定ステータス -->
    <div class="card">
        <h3>照合判定</h3>
        <div id="judgment-status" class="status waiting">QRとバーコードを読み取ってください</div>
    </div>

    <!-- 3. QRコード読み取り結果 -->
    <div class="card">
        <h3>① QRコード解析結果</h3>
        <div class="result-box">
            <div class="label">ITFコード (レジスタ1-7: 14桁)</div>
            <div id="qr-itf" class="value">---</div>
            <div class="label">品番 (レジスタ8-11: 8桁)</div>
            <div id="qr-name" class="value">---</div>
            <div class="label">ナンバリング (レジスタ19-20: 4桁)</div>
            <div id="qr-num" class="value">---</div>
            <div class="label">品名 (レジスタ21-28: 16桁)</div>
            <div id="qr-title" class="value">---</div>
            <div class="label">生データ（全体）</div>
            <div id="qr-raw" class="value" style="font-size:11px; color:#777; font-weight:normal;">---</div>
        </div>
    </div>

    <!-- 4. バーコード読み取り結果 -->
    <div class="card">
        <h3>② バーコード (ITF) 読取結果</h3>
        <div class="result-box">
            <div class="label">読み取ったITFコード</div>
            <div id="bar-itf" class="value">---</div>
        </div>
    </div>

<script>
let html5QrCode = null;
let savedQrItf = null;
let savedBarItf = null;
let isPaused = false; // 連続読み込みを一時制御するフラグ

// ページ読み込み時に自動でカメラ起動
window.onload = startScanner;

function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    
    // QRコードとITFバーコードのみに絞って処理を高速化
    const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.ITF
        ]
    };

    // カメラの解像度をフルHD相当に引き上げる設定
    const videoConstraints = {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: "continuous" }]
    };

    html5QrCode.start(videoConstraints, config, onScanSuccess)
    .then(() => {
        resetApp();
    })
    .catch(err => {
        document.getElementById("judgment-status").innerText = "カメラの起動に失敗しました。Safariの設定でカメラへのアクセスを許可してください。";
        document.getElementById("judgment-status").className = "status mismatch";
        console.error(err);
    });
}

// 読み取り成功時の処理
function onScanSuccess(decodedText, decodedResult) {
    // 判定処理中の時はスルーする（重複読み込み防止）
    if (isPaused) return;

    const formatName = decodedResult.result.format.formatName;
    
    // 【判定】QRコードを読み取った場合
    if (formatName === "QR_CODE") {
        document.getElementById("qr-raw").innerText = decodedText;

        // ご提示のレジスタ仕様（半角1文字=インデックス1つ分）に準拠した切り出し
        savedQrItf = decodedText.slice(0, 14).trim();       // レジスタ1-7 (14桁)
        const pinban = decodedText.slice(14, 22).trim();     // レジスタ8-11 (8桁)
        const numbering = decodedText.slice(36, 40).trim();  // レジスタ19-20 (4桁)
        const hinmei = decodedText.slice(40, 56).trim();     // レジスタ21-28 (16桁)

        // 画面に反映
        document.getElementById("qr-itf").innerText = savedQrItf;
        document.getElementById("qr-name").innerText = pinban;
        document.getElementById("qr-num").innerText = numbering;
        document.getElementById("qr-title").innerText = hinmei;

        checkMatch();
    } 
    // 【判定】バーコード（ITF）を読み取った場合
    else if (formatName === "ITF") {
        const cleanBar = decodedText.replace(/[^0-9]/g, "");
        if (cleanBar.length >= 13) {
            savedBarItf = cleanBar;
            document.getElementById("bar-itf").innerText = savedBarItf;
            checkMatch();
        }
    }
}

// 照合判定を行う関数
function checkMatch() {
    const statusEl = document.getElementById("judgment-status");
    
    if (!savedQrItf && !savedBarItf) {
        statusEl.innerText = "QRとバーコードを読み取ってください";
        statusEl.className = "status waiting";
    } else if (savedQrItf && !savedBarItf) {
        statusEl.innerText = "バーコード(ITF)を読み取ってください";
        statusEl.className = "status waiting";
    } else if (!savedQrItf && savedBarItf) {
        statusEl.innerText = "QRコードを読み取ってください";
        statusEl.className = "status waiting";
    } else {
        // 両方揃ったら一致しているか比較
        if (savedQrItf === savedBarItf) {
            statusEl.innerText = "【一致】判定OK！";
            statusEl.className = "status match";
            
            // 一致したら2.5秒間スキャンを一時停止し、自動でリセットして再開
            isPaused = true;
            setTimeout(resetApp, 2500);
        } else {
            statusEl.innerText = "【不一致】エラー！ITFコードが違います";
            statusEl.className = "status mismatch";
        }
    }
}

// データを初期化して次のスキャンに備える
function resetApp() {
    savedQrItf = null;
    savedBarItf = null;
    document.getElementById("qr-itf").innerText = "---";
    document.getElementById("qr-name").innerText = "---";
    document.getElementById("qr-num").innerText = "---";
    document.getElementById("qr-title").innerText = "---";
    document.getElementById("qr-raw").innerText = "---";
    document.getElementById("bar-itf").innerText = "---";
    checkMatch();
    isPaused = false; // スキャンを再開
}
</script>
</body>
</html>
