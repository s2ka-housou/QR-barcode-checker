<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR・バーコード照合アプリ</title>
    <!-- 世界で最も使われている超軽量・多機能なZXingライブラリを使用 -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; color: #333; }
        h1 { font-size: 18px; text-align: center; margin-bottom: 16px; }
        .card { background: white; padding: 14px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 12px; }
        button { width: 100%; padding: 14px; background: #0071e3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #camera-area { position: relative; width: 100%; max-width: 360px; margin: 0 auto; display: none; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; height: auto; display: block; }
        .result-box { margin-top: 8px; padding: 10px; border-radius: 8px; background: #f0f0f2; font-size: 14px; line-height: 1.5; }
        .label { font-weight: bold; color: #666; font-size: 11px; margin-top: 4px; }
        .value { font-size: 15px; color: #000; font-family: monospace; font-weight: bold; margin-bottom: 4px; word-break: break-all; }
        .status { text-align: center; font-size: 18px; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 8px; }
        .match { background: #e2fbe8; color: #1e7e34; }
        .mismatch { background: #fce8e6; color: #c53929; }
        .waiting { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <h1>QR・バーコード照合アプリ</h1>

    <!-- 1. カメラエリア -->
    <div class="card">
        <button id="start-btn" onclick="initCamera()">スキャンを開始する</button>
        <div id="camera-area">
            <!-- iOS Safari特有の再生ブロックを回避する呪文を全て追加 -->
            <video id="video" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- 2. 照合判定ステータス -->
    <div class="card">
        <h3>照合判定</h3>
        <div id="judgment-status" class="status waiting">QRとバーコードを読み取ってください</div>
    </div>

    <!-- 3. QRコード読み取り結果 -->
    <div class="card">
        <h3>① QRコード解析結果</h3>
        <div class="result-box">
            <div class="label">ITFコード (レジスタ1-7: 14桁)</div>
            <div id="qr-itf" class="value">---</div>
            <div class="label">品番 (レジスタ8-11: 8桁)</div>
            <div id="qr-name" class="value">---</div>
            <div class="label">ナンバリング (レジスタ19-20: 4桁)</div>
            <div id="qr-num" class="value">---</div>
            <div class="label">品名 (レジスタ21-28: 16桁)</div>
            <div id="qr-title" class="value">---</div>
            <div class="label">生データ（全体）</div>
            <div id="qr-raw" class="value" style="font-size:11px; color:#777; font-weight:normal;">---</div>
        </div>
    </div>

    <!-- 4. バーコード読み取り結果 -->
    <div class="card">
        <h3>② バーコード (ITF) 読取結果</h3>
        <div class="result-box">
            <div class="label">読み取ったITFコード</div>
            <div id="bar-itf" class="value">---</div>
        </div>
    </div>

<script>
let codeReader = null;
let savedQrItf = null;
let savedBarItf = null;

// カメラ初期化
async function initCamera() {
    document.getElementById('start-btn').style.display = "none";
    document.getElementById('camera-area').style.display = "block";
    
    // QRコードとITF(バーコード)の両方を同時に読み込む設定
    const hints = new Map();
    const formats = [
        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.ITF
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    
    codeReader = new ZXing.BrowserMultiFormatReader(hints);

    try {
        // iOS Safariで最も確実に背面カメラ(environment)を指定する方法
        const constraints = {
            video: {
                facingMode: { exact: "environment" } // 強制的に背面カメラを指定
            }
        };

        // スキャン開始（videoタグにストリームを流し込む）
        codeReader.decodeFromConstraints(constraints, 'video', (result, err) => {
            if (result) {
                const rawData = result.getText();
                const formatName = result.getBarcodeFormat();

                // 【判定】QRコードの場合
                if (formatName === 0 || result.barcodeFormat === ZXing.BarcodeFormat.QR_CODE) { 
                    processQrData(rawData);
                } 
                // 【判定】ITF（バーコード）の場合
                else if (formatName === 11 || result.barcodeFormat === ZXing.BarcodeFormat.ITF) {
                    processBarcodeData(rawData);
                }
            }
        });
    } catch (err) {
        // 万が一、広角・望遠などの複数レンズの関係でexact指定が弾かれた場合のバックアップ
        try {
            codeReader.decodeFromConstraints({ video: { facingMode: "environment" } }, 'video', (result, err) => {
                if (result) {
                    const rawData = result.getText();
                    if (result.getBarcodeFormat() === 0) processQrData(rawData);
                    else if (result.getBarcodeFormat() === 11) processBarcodeData(rawData);
                }
            });
        } catch (e) {
            alert("カメラの起動に失敗しました。Safariの設定でカメラ許可をご確認ください。");
            document.getElementById('start-btn').style.display = "block";
            document.getElementById('camera-area').style.display = "none";
        }
    }
}

// QRコードのデータ固定長切り出し
function processQrData(text) {
    document.getElementById("qr-raw").innerText = text;

    // ご提示のレジスタ仕様（半角1文字=インデックス1つ分）に準拠した正確な切り出し
    savedQrItf = text.slice(0, 14).trim();       // レジスタ1-7 (14桁)
    const pinban = text.slice(14, 22).trim();     // レジスタ8-11 (8桁)
    const numbering = text.slice(36, 40).trim();  // レジスタ19-20 (4桁)
    const hinmei = text.slice(40, 56).trim();     // レジスタ21-28 (16桁)

    document.getElementById("qr-itf").innerText = savedQrItf;
    document.getElementById("qr-name").innerText = pinban;
    document.getElementById("qr-num").innerText = numbering;
    document.getElementById("qr-title").innerText = hinmei;

    checkMatch();
}

// バーコード（ITF）データの処理
function processBarcodeData(text) {
    const cleanBar = text.replace(/[^0-9]/g, "");
    if (cleanBar.length >= 13) {
        if (savedBarItf !== cleanBar) {
            savedBarItf = cleanBar;
            document.getElementById("bar-itf").innerText = savedBarItf;
            checkMatch();
        }
    }
}

// 照合判定
function checkMatch() {
    const statusEl = document.getElementById("judgment-status");
    
    if (!savedQrItf && !savedBarItf) {
        statusEl.innerText = "QRとバーコードを読み取ってください";
        statusEl.className = "status waiting";
    } else if (savedQrItf && !savedBarItf) {
        statusEl.innerText = "バーコード(ITF)を読み取ってください";
        statusEl.className = "status waiting";
    } else if (!savedQrItf && savedBarItf) {
        statusEl.innerText = "QRコードを読み取ってください";
        statusEl.className = "status waiting";
    } else {
        if (savedQrItf === savedBarItf) {
            statusEl.innerText = "【一致】判定OK！";
            statusEl.className = "status match";
            codeReader.reset();
            setTimeout(resetData, 2500);
        } else {
            statusEl.innerText = "【不一致】エラー！ITFコードが違います";
            statusEl.className = "status mismatch";
        }
    }
}

// データリセットとスキャン再開
function resetData() {
    savedQrItf = null;
    savedBarItf = null;
    document.getElementById("qr-itf").innerText = "---";
    document.getElementById("qr-name").innerText = "---";
    document.getElementById("qr-num").innerText = "---";
    document.getElementById("qr-title").innerText = "---";
    document.getElementById("qr-raw").innerText = "---";
    document.getElementById("bar-itf").innerText = "---";
    checkMatch();
    initCamera(); // スキャン再開のために再初期化
}
</script>
</body>
</html>
