<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR・バーコード照合アプリ</title>
    <!-- QR・バーコード解析用の超高機能ライブラリを読み込み -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f5f5f7; color: #333; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; }
        .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
        button { width: 100%; padding: 14px; background: #0071e3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background: #005bb5; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        .result-box { margin-top: 12px; padding: 12px; border-radius: 8px; background: #f0f0f2; font-size: 14px; line-height: 1.6; }
        .label { font-weight: bold; color: #666; font-size: 12px; margin-top: 6px; }
        .value { font-size: 16px; color: #000; word-break: break-all; margin-bottom: 8px; }
        .status { text-align: center; font-size: 20px; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 12px; }
        .match { background: #e2fbe8; color: #1e7e34; }
        .mismatch { background: #fce8e6; color: #c53929; }
        .waiting { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <h1>QR・バーコード照合アプリ</h1>

    <!-- 1. カメラエリア -->
    <div class="card">
        <div id="reader"></div>
        <div style="margin-top: 12px;">
            <button id="start-btn" onclick="startScanner()">スキャンを開始する</button>
        </div>
    </div>

    <!-- 2. QRコード読み取り結果 -->
    <div class="card">
        <h3>① QRコードデータ</h3>
        <div class="result-box">
            <div class="label">ITFコード (品番)</div>
            <div id="qr-itf" class="value">---</div>
            <div class="label">品名</div>
            <div id="qr-name" class="value">---</div>
            <div class="label">ナンバリング</div>
            <div id="qr-num" class="value">---</div>
            <div class="label">生データ（全体）</div>
            <div id="qr-raw" class="value" style="font-size:12px; color:#666;">---</div>
        </div>
    </div>

    <!-- 3. バーコード読み取り結果 -->
    <div class="card">
        <h3>② バーコード (ITF)</h3>
        <div class="result-box">
            <div class="label">読み取ったITFコード</div>
            <div id="bar-itf" class="value">---</div>
        </div>
    </div>

    <!-- 4. 照合判定ステータス -->
    <div class="card">
        <h3>③ 照合判定</h3>
        <div id="judgment-status" class="status waiting">QRとバーコードを読み取ってください</div>
    </div>

<script>
let html5QrcodeScanner = null;
let savedQrItf = null;
let savedBarItf = null;

// スキャナーの起動
function startScanner() {
    document.getElementById("start-btn").style.display = "none";
    
    // QRコードと主要なバーコード（ITF含む）を同時に読み取る設定
    html5QrcodeScanner = new Html5Qrcode("reader");
    
    const config = { 
        fps: 10, 
        qrbox: function(width, height) {
            return { width: width * 0.8, height: height * 0.4 }; // 横長の読み取り枠
        }
    };

    html5QrcodeScanner.start(
        { facingMode: "environment" }, // 背面カメラを使用
        config,
        onScanSuccess
    ).catch(err => {
        alert("カメラの起動に失敗しました。HTTPS通信であることと、カメラ許可を確認してください。");
        document.getElementById("start-btn").style.display = "block";
    });
}

// 読み取り成功時の処理
function onScanSuccess(decodedText, decodedResult) {
    const formatName = decodedResult.result.format.formatName;
    
    // 【判定】QRコードを読み取った場合
    if (formatName === "QR_CODE") {
        document.getElementById("qr-raw").innerText = decodedText;
        
        /* 
          ★データ仕分けのロジック★
          ※ここでは仮に「カンマ（,）」でデータが区切られていると想定しています。
          例: "ITF123456789,型番A-1,No_001" 
          実際のQRのデータ形式に合わせて後からこの部分を書き換えます。
        */
        const items = decodedText.split(","); 
        
        if (items.length >= 1) {
            savedQrItf = items[0].trim(); // 1番目をITFコードとする
            document.getElementById("qr-itf").innerText = savedQrItf;
        }
        if (items.length >= 2) {
            document.getElementById("qr-name").innerText = items[1].trim(); // 2番目を品名
        }
        if (items.length >= 3) {
            document.getElementById("qr-num").innerText = items[2].trim(); // 3番目をナンバリング
        }
        
        // ピッと音を鳴らす（スマホのバイブや音はブラウザ制限があるため簡易的に視覚効果）
        vibrateSimple();
    } 
    // 【判定】バーコード（ITFなど）を読み取った場合
    else if (formatName === "ITF" || formatName === "CODE_128" || formatName === "EAN_13") {
        savedBarItf = decodedText.trim();
        document.getElementById("bar-itf").innerText = savedBarItf;
        vibrateSimple();
    }

    // 毎回、照合チェックを実行
    checkMatch();
}

// 照合判定を行う関数
function checkMatch() {
    const statusEl = document.getElementById("judgment-status");
    
    if (!savedQrItf && !savedBarItf) {
        statusEl.innerText = "QRとバーコードを読み取ってください";
        statusEl.className = "status waiting";
    } else if (savedQrItf && !savedBarItf) {
        statusEl.innerText = "バーコードを読み取ってください";
        statusEl.className = "status waiting";
    } else if (!savedQrItf && savedBarItf) {
        statusEl.innerText = "QRコードを読み取ってください";
        statusEl.className = "status waiting";
    } else {
        // 両方揃ったら一致しているか比較
        if (savedQrItf === savedBarItf) {
            statusEl.innerText = "【一致】判定OK！";
            statusEl.className = "status match";
            // 成功したら3秒後に次のスキャンへ向けてリセット（実用性を考慮）
            setTimeout(resetData, 3000);
        } else {
            statusEl.innerText = "【不一致】エラー！コードが違います";
            statusEl.className = "status mismatch";
        }
    }
}

// データを初期化して次のスキャンに備える
function resetData() {
    savedQrItf = null;
    savedBarItf = null;
    document.getElementById("qr-itf").innerText = "---";
    document.getElementById("qr-name").innerText = "---";
    document.getElementById("qr-num").innerText = "---";
    document.getElementById("qr-raw").innerText = "---";
    document.getElementById("bar-itf").innerText = "---";
    checkMatch();
}

// 簡易的な読み取り成功の視覚フィードバック（画面を一瞬光らせる）
function vibrateSimple() {
    if (navigator.vibrate) navigator.vibrate(200); // Androidなら振動
}
</script>
</body>
</html>
