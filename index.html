<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="コード照合">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>QR・ITF コード照合</title>

  <!-- 画像ファイルから QR / ITF を解析する WebAssembly ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.1/dist/iife/reader/index.js"></script>

  <style>
    :root {
      color-scheme: light;
      --navy: #0f172a;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green-bg: #dcfce7;
      --green-text: #166534;
      --red-bg: #fee2e2;
      --red-text: #991b1b;
      --yellow-bg: #fef3c7;
      --yellow-text: #92400e;
      --line: #dbe3ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f1f5f9;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 1.35rem;
      text-align: center;
      color: var(--navy);
    }

    .lead {
      margin: 0 0 18px;
      color: #475569;
      font-size: .92rem;
      line-height: 1.55;
      text-align: center;
    }

    .card {
      margin: 14px 0;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
    }

    button, .file-button {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    button:hover, .file-button:hover { background: var(--blue-dark); }
    button:disabled { cursor: wait; opacity: .62; }

    .file-button input { display: none; }

    #status {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    #status[data-type="working"] {
      border-color: #fcd34d;
      background: var(--yellow-bg);
      color: var(--yellow-text);
    }

    #status[data-type="ok"] {
      border-color: #86efac;
      background: var(--green-bg);
      color: var(--green-text);
    }

    #status[data-type="ng"] {
      border-color: #fca5a5;
      background: var(--red-bg);
      color: var(--red-text);
    }

    #preview-wrap { display: none; }

    #preview {
      display: block;
      width: 100%;
      max-height: 440px;
      margin-top: 10px;
      border-radius: 10px;
      background: #0f172a;
      object-fit: contain;
    }

    .hint {
      margin: 10px 0 0;
      color: #64748b;
      font-size: .84rem;
      line-height: 1.5;
    }

    .result-card { display: none; }
    .result-card.visible { display: block; }

    h2 {
      margin: 0 0 10px;
      padding-bottom: 7px;
      border-bottom: 2px solid #bfdbfe;
      color: #1e40af;
      font-size: 1.02rem;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 4px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    th { width: 36%; color: #64748b; font-size: .85rem; font-weight: 600; }
    td { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; overflow-wrap: anywhere; }

    .barcode {
      margin: 0;
      color: var(--navy);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(1.05rem, 5vw, 1.45rem);
      font-weight: 800;
      letter-spacing: .04em;
      text-align: center;
      word-break: break-all;
    }

    .secondary {
      margin-top: 12px;
      background: #64748b;
    }

    .secondary:hover { background: #475569; }

    .detail {
      margin: 10px 0 0;
      color: #64748b;
      font-size: .8rem;
      line-height: 1.5;
    }

    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      margin-right: .45em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: -.12em;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <main>
    <h1>QR・ITF コード照合</h1>
    <p class="lead">ラベル全体が写った写真を選択すると、QRコードとITFバーコードを個別に解析して照合します。</p>

    <section class="card">
      <!-- ブラウザの安全仕様上、写真ライブラリはユーザーのタップでのみ開けます。 -->
      <label class="file-button" for="photo-input">
        写真を選択して解析
        <input id="photo-input" type="file" accept="image/*">
      </label>
      <p class="hint">黒地に白いコード、汚れ、反射を考慮して、反転・コントラスト強調・二値化を順に試します。</p>
    </section>

    <div id="status" role="status" aria-live="polite">写真を選択してください</div>

    <section id="preview-wrap" class="card">
      <strong>選択した画像</strong>
      <img id="preview" alt="選択したラベル画像のプレビュー">
      <p class="hint">QRが右上、ITFバーコードが下側にあるレイアウトを優先して解析します。</p>
    </section>

    <section id="qr-result" class="card result-card">
      <h2>QRコード情報</h2>
      <table>
        <tr><th>ITFコード</th><td id="res-itf"></td></tr>
        <tr><th>部品分</th><td id="res-part"></td></tr>
        <tr><th>ロット区分</th><td id="res-lot"></td></tr>
        <tr><th>製造ロット</th><td id="res-mfg-lot"></td></tr>
        <tr><th>製造日時</th><td id="res-mfg-time"></td></tr>
        <tr><th>ナンバリング</th><td id="res-num"></td></tr>
        <tr><th>製品名</th><td id="res-name"></td></tr>
      </table>
      <p id="res-qr-method" class="detail"></p>
    </section>

    <section id="barcode-result" class="card result-card">
      <h2>ITFバーコード</h2>
      <p id="res-barcode" class="barcode"></p>
      <p id="res-barcode-method" class="detail"></p>
    </section>

    <button id="btn-reset" class="secondary" type="button" hidden>別の写真を選択</button>
  </main>

  <script>
    "use strict";

    // このレイアウトにおけるコード位置。撮影時の余白の違いを吸収するため少し広めに取る。
    const LAYOUT = {
      qr: { x: 0.47, y: 0.24, width: 0.43, height: 0.34, scale: 1.5 },
      itf: { x: 0.07, y: 0.56, width: 0.87, height: 0.29, scale: 1.3 }
    };

    const MAX_IMAGE_DIMENSION = 3000;
    const input = document.getElementById("photo-input");
    const preview = document.getElementById("preview");
    const previewWrap = document.getElementById("preview-wrap");
    const resetButton = document.getElementById("btn-reset");

    let sourceCanvas = null;
    let qrData = null;
    let barcodeData = null;

    input.addEventListener("change", async (event) => {
      const [file] = event.target.files;
      if (!file) return;

      await analyseFile(file);
      // 同じ画像を続けて選べるようにする。
      input.value = "";
    });

    resetButton.addEventListener("click", () => {
      qrData = null;
      barcodeData = null;
      sourceCanvas = null;
      preview.removeAttribute("src");
      previewWrap.style.display = "none";
      document.getElementById("qr-result").classList.remove("visible");
      document.getElementById("barcode-result").classList.remove("visible");
      resetButton.hidden = true;
      setStatus("写真を選択してください");
    });

    async function analyseFile(file) {
      if (!window.ZXingWASM || !window.ZXingWASM.readBarcodes) {
        setStatus("解析ライブラリを読み込めませんでした。ネットワーク接続を確認してください。", "ng");
        return;
      }

      try {
        clearResults();
        setBusy("画像を読み込んでいます…");
        sourceCanvas = await fileToCanvas(file);
        preview.src = sourceCanvas.toDataURL("image/jpeg", 0.88);
        previewWrap.style.display = "block";

        setBusy("写真全体からQRコードとITFを解析しています…");
        const wholeImage = canvasImageData(sourceCanvas);
        const wholeResults = await scanImage(wholeImage, ["QRCode", "ITF"], "全体画像・標準解析");
        acceptResults(wholeResults);

        // 全体画像で不足したコードだけを、位置に合わせて強めの前処理で追加解析する。
        if (!qrData) {
          const qrImage = cropByLayout(sourceCanvas, LAYOUT.qr);
          const qrResults = await scanVariants(qrImage, ["QRCode"], "QR領域");
          acceptResults(qrResults);
        }

        if (!barcodeData) {
          const itfImage = cropByLayout(sourceCanvas, LAYOUT.itf);
          const itfResults = await scanVariants(itfImage, ["ITF"], "ITF領域");
          acceptResults(itfResults);
        }

        renderResults();
      } catch (error) {
        console.error(error);
        setStatus("画像を解析できませんでした。別の写真で試してください。", "ng");
      }
    }

    async function fileToCanvas(file) {
      const image = await loadImage(file);
      const longestSide = Math.max(image.naturalWidth, image.naturalHeight);
      const scale = Math.min(1, MAX_IMAGE_DIMENSION / longestSide);
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0, width, height);
      return canvas;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("選択したファイルを画像として開けません。"));
        };
        image.src = url;
      });
    }

    function canvasImageData(canvas) {
      return canvas.getContext("2d", { willReadFrequently: true })
        .getImageData(0, 0, canvas.width, canvas.height);
    }

    function cropByLayout(canvas, area) {
      const sx = Math.floor(canvas.width * area.x);
      const sy = Math.floor(canvas.height * area.y);
      const sw = Math.min(canvas.width - sx, Math.ceil(canvas.width * area.width));
      const sh = Math.min(canvas.height - sy, Math.ceil(canvas.height * area.height));
      const scale = area.scale || 1;
      const targetWidth = Math.round(sw * scale);
      const targetHeight = Math.round(sh * scale);
      const cropped = document.createElement("canvas");
      cropped.width = targetWidth;
      cropped.height = targetHeight;
      const context = cropped.getContext("2d", { willReadFrequently: true });
      context.imageSmoothingEnabled = true;
      context.drawImage(canvas, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);
      return canvasImageData(cropped);
    }

    async function scanImage(imageData, formats, method) {
      try {
        const results = await window.ZXingWASM.readBarcodes(imageData, {
          formats,
          maxNumberOfSymbols: 5,
          tryHarder: true,
          tryInvert: true,
          tryRotate: true,
          tryDenoise: true,
          binarizer: "LocalAverage"
        });
        return results.map(result => ({ ...result, method }));
      } catch (error) {
        console.info(`${method}では読み取れませんでした。`, error);
        return [];
      }
    }

    async function scanVariants(original, formats, areaName) {
      // 初回はZXingの反転・局所二値化に任せ、失敗時のみCanvasで補正画像を生成する。
      const variants = [
        { name: "標準（反転検出あり）", data: original },
        { name: "グレースケール・コントラスト強調", data: enhanceContrast(original) },
        { name: "大津の二値化", data: binarizeOtsu(original, false) },
        { name: "反転二値化", data: binarizeOtsu(original, true) }
      ];

      const allResults = [];
      for (let i = 0; i < variants.length; i += 1) {
        const variant = variants[i];
        setBusy(`${areaName}を解析中…（補正 ${i + 1}/${variants.length}：${variant.name}）`);
        const results = await scanImage(variant.data, formats, `${areaName}・${variant.name}`);
        allResults.push(...results);

        // 対象が読めた場合は後続の重い処理をしない。
        if (formats.includes("QRCode") && findQrResult(allResults)) break;
        if (formats.includes("ITF") && findItfResult(allResults)) break;
      }
      return allResults;
    }

    function enhanceContrast(imageData) {
      const output = new ImageData(imageData.width, imageData.height);
      const input = imageData.data;
      const data = output.data;
      const contrast = 1.85;

      for (let i = 0; i < input.length; i += 4) {
        const gray = 0.299 * input[i] + 0.587 * input[i + 1] + 0.114 * input[i + 2];
        const enhanced = clamp(Math.round(128 + (gray - 128) * contrast), 0, 255);
        data[i] = enhanced;
        data[i + 1] = enhanced;
        data[i + 2] = enhanced;
        data[i + 3] = input[i + 3];
      }
      return output;
    }

    function binarizeOtsu(imageData, invert) {
      const contrastImage = enhanceContrast(imageData);
      const histogram = new Uint32Array(256);
      const { data } = contrastImage;

      for (let i = 0; i < data.length; i += 4) histogram[data[i]] += 1;

      const total = contrastImage.width * contrastImage.height;
      let sum = 0;
      for (let i = 0; i < 256; i += 1) sum += i * histogram[i];

      let sumBackground = 0;
      let weightBackground = 0;
      let maxVariance = 0;
      let threshold = 127;

      for (let i = 0; i < 256; i += 1) {
        weightBackground += histogram[i];
        if (weightBackground === 0) continue;
        const weightForeground = total - weightBackground;
        if (weightForeground === 0) break;
        sumBackground += i * histogram[i];
        const meanBackground = sumBackground / weightBackground;
        const meanForeground = (sum - sumBackground) / weightForeground;
        const variance = weightBackground * weightForeground * (meanBackground - meanForeground) ** 2;
        if (variance > maxVariance) {
          maxVariance = variance;
          threshold = i;
        }
      }

      for (let i = 0; i < data.length; i += 4) {
        const isDark = data[i] <= threshold;
        const value = (isDark !== invert) ? 0 : 255;
        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;
      }
      return contrastImage;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function acceptResults(results) {
      if (!qrData) {
        const qrResult = findQrResult(results);
        if (qrResult) qrData = qrResult;
      }
      if (!barcodeData) {
        const itfResult = findItfResult(results);
        if (itfResult) barcodeData = itfResult;
      }
    }

    function findQrResult(results) {
      return results.find(result => {
        const format = String(result.format || "").toUpperCase();
        const parsed = parseQRCode(result.text || "");
        return format.includes("QRCODE") && /^\d{14}$/.test(parsed.itf);
      }) || null;
    }

    function findItfResult(results) {
      return results.find(result => {
        const format = String(result.format || "").toUpperCase();
        const value = normalizeBarcode(result.text || "");
        return format.startsWith("ITF") && /^\d{14}$/.test(value);
      }) || null;
    }

    function normalizeBarcode(value) {
      return String(value).replace(/\s/g, "");
    }

    function parseQRCode(text) {
      const value = String(text).trim();
      const part = (start, end) => value.substring(start, end).trim();
      const rawDateTime = part(24, 36);
      let mfgLot = rawDateTime;
      let mfgTime = "";

      if (/^\d{12}$/.test(rawDateTime)) {
        mfgLot = rawDateTime.substring(0, 6);
        mfgTime = `${rawDateTime.substring(6, 8)}時${rawDateTime.substring(8, 10)}分${rawDateTime.substring(10, 12)}秒`;
      }

      return {
        itf: part(0, 14),
        partNo: part(14, 22),
        lotMix: part(22, 24),
        mfgLot,
        mfgTime,
        numbering: part(36, 40),
        productName: part(40, 56)
      };
    }

    function renderResults() {
      const qrResultBox = document.getElementById("qr-result");
      const barcodeResultBox = document.getElementById("barcode-result");

      if (qrData) {
        const parsed = parseQRCode(qrData.text);
        setText("res-itf", parsed.itf);
        setText("res-part", parsed.partNo);
        setText("res-lot", parsed.lotMix);
        setText("res-mfg-lot", parsed.mfgLot);
        setText("res-mfg-time", parsed.mfgTime);
        setText("res-num", parsed.numbering);
        setText("res-name", parsed.productName);
        setText("res-qr-method", `読取方法：${qrData.method}`);
        qrResultBox.classList.add("visible");
      }

      if (barcodeData) {
        setText("res-barcode", normalizeBarcode(barcodeData.text));
        setText("res-barcode-method", `読取方法：${barcodeData.method}`);
        barcodeResultBox.classList.add("visible");
      }

      resetButton.hidden = false;

      if (qrData && barcodeData) {
        const qrItf = parseQRCode(qrData.text).itf;
        const barcodeItf = normalizeBarcode(barcodeData.text);
        if (qrItf === barcodeItf) {
          setStatus("照合OK：QRコードとITFバーコードが一致しました。", "ok");
        } else {
          setStatus("照合NG：QRコードとITFバーコードが一致しません。", "ng");
        }
      } else if (!qrData && !barcodeData) {
        setStatus("QRコードとITFバーコードを読み取れませんでした。ラベル全体が明るく鮮明に写った写真で試してください。", "ng");
      } else if (!qrData) {
        setStatus("ITFバーコードは読み取れましたが、QRコードを読み取れませんでした。", "ng");
      } else {
        setStatus("QRコードは読み取れましたが、ITFバーコードを読み取れませんでした。", "ng");
      }
    }

    function clearResults() {
      qrData = null;
      barcodeData = null;
      document.getElementById("qr-result").classList.remove("visible");
      document.getElementById("barcode-result").classList.remove("visible");
      resetButton.hidden = true;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value || "―";
    }

    function setBusy(message) {
      const status = document.getElementById("status");
      status.innerHTML = `<span class="spinner" aria-hidden="true"></span>${escapeHtml(message)}`;
      status.dataset.type = "working";
    }

    function setStatus(message, type = "") {
      const status = document.getElementById("status");
      status.textContent = message;
      status.dataset.type = type;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
